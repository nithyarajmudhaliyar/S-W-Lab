<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .test{
            width: 100px;
            height: 100px;
            background-color: purple;
            color: white;
            /* transition: all 3s ease-in-out; */
            position: relative;
            animation: movebox 3s ease-in-out infinite alternate;
        }
        /* .test:hover{
            width: 400px;
            background-color: hotpink;
        } */
        @keyframes movebox{
            0%{top: 0px; left: 0px}
            25%{top: 0px; left: 300px}
            50%{top: 300px; left: 300px}
            75%{top: 300px; left: 0px}
            100%{top: 300px; left: 300px}
            /* from{
                top: 0px;
                left: 0px;
            }
            to{
                top: 0px;
                left: 300px;
            } */
        }
    </style>
</head>
<body>
    <div class="test">Surprise Test</div>
</body>
</html>
