<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: repeat(4,1fr);
            background-color: lightgray;
            border: 1px solid black;
            width: 80vh;
            height: 80vh;
        }
        .item1{
            background-color: green;
            border: 2px solid darkgreen;
            grid-column: 2/3;
            grid-row: 4/5;
        }
        .item2{
            background-color: green;
            border: 2px solid darkgreen;
            grid-column: 3/4;
            grid-row: 4/5;
        }
        .item3{
            background-color: green;
            border: 2px solid darkgreen;
            grid-column: 3/4;
            grid-row: 3/4;
        }
        .item4{
            background-color: green;
            border: 2px solid darkgreen;
            grid-column: 4/5;   
            grid-row: 3/4;
        }
        .item5{
            background-color: red;
            border: 2px solid darkgreen;
            grid-column: 4/5;
            grid-row: 2/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
    </div>
</body>
</html>
