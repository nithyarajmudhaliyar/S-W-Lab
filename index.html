<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: grid;
      gap: 15px;
      grid-template-columns: repeat(3,1fr);
    }
    .red{
      background-color: red;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="red">Box1</div>
    <div class="red">Box2</div>
    <div class="red">Box3</div>
    <div class="red">Box4</div>
    <div class="red">Box5</div>
    <div class="red">Box6</div>
  </div>
</body>
</html>
