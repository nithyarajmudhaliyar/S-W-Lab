<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet Shortcuts</title>
</head>
<body>
    <div class="box"></div>       <!--div.box or .box -->
    <div id="box"></div>       <!-- div#box or #box -->
    <div class="box1"></div>   <!--  div.box$*4  or .box$*4-->
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>

    <div id="box1"></div>    <!--  div#box$*4 -->
    <div id="box2"></div>
    <div id="box3"></div>
    <div id="box4"></div>

    <div class="container">          <!-- .container>.box$*4 -->
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
    
    <a href="https://www.google.com/"></a>             <!-- a[href="https://www.google.com/"] -->

    <h1></h1>        <!-- h1+p -->
    <p></p>

    <p>Hello</p>        <!-- p{Hello} -->
    <a href="">Click me</a>        <!-- a{Click me}  -->
</body>
</html>
