<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            border: 10px dashed black;
            border-radius: 100%;
            animation: moveit 3s linear infinite;
            margin-right: 200px;
            margin-top: 200px;
        }
        @keyframes moveit{
            0%{
                transform: rotate(0deg) s(1.2);
            }
            100%{
                transform: rotate(360deg) scale(2);
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
